<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-page">
        <div class="transparent-div">
          <div class="odin-container">
            <img class="odin-logo" src="odin-lined.png" alt="Odin logo image" />
            <div class="odin-text">ODIN</div>
          </div>
        </div>
        <div class="credit-div">
          Photo by Halie West on &nbsp;
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
            >Unsplash</a
          >
        </div>
      </div>
      <div class="right-page">
        <div class="top-div">
          <span
            >This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            now to get started. You know you want to.</span
          >
        </div>
        <div class="middle-div">
          <div class="middle-div-text">Let's do this!</div>
          <form action="" method="post">
            <p>
              <label for="first_name">FIRST NAME</label>
              <input type="text" id="first_name" name="first_name" />
            </p>
            <p>
              <label for="last_name">LAST NAME</label>
              <input type="text" id="last_name" name="last_name" />
            </p>
            <p>
              <label for="user_emaiL">EMAIL</label>
              <input type="email" id="user_email" name="email" />
            </p>
            <p>
              <label for="phone_number">PHONE NUMBER</label>
              <input type="text" id="phone_number" name="phone_number" />
            </p>
            <p>
              <label for="user_password">PASSWORD</label>
              <input type="password" id="user_password" name="password" required/>
            </p>
            <p>
              <label for="confirm_password">CONFIRM PASSWORD</label>
              <input type="password" id="confirm_password" name="confirm_password" required/>
            </p>
          </form>
        </div>
        <div class="bottom-div"></div>
      </div>
    </div>
  </body>
</html>
